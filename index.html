<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic</title>
    <style>
        :root {
            --color-health: #F08209;
            --color-work: #8B5CF6;
            --color-personal: #3B82F6;
            --bg-dark: #121212;
            --bg-card: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.5rem;
            margin: 10px 0 20px 0;
            text-align: center;
        }

        .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
        }

        button {
            background-color: #252525;
            color: #fff;
            border: 1px solid #444;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .table-container {
            width: 100%;
            max-width: 500px;
            background-color: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .grid-header, .grid-row {
            display: grid;
            grid-template-columns: 110px 1fr 60px;
            align-items: center;
            border-bottom: 1px solid #2d2d2d;
        }

        .grid-header {
            background-color: #252525;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 12px 0;
            text-align: center;
        }

        .grid-row {
            padding: 14px 0;
            transition: background-color 0.2s;
        }

        .col-time {
            text-align: center;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .col-task {
            padding: 0 10px;
            font-size: 0.95rem;
            line-height: 1.3;
            font-weight: 500;
        }

        .col-check {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
        }

        /* Clasele de stil generate dinamic în funcție de coloana A */
        .cat-health { border-left: 4px solid var(--color-health); color: var(--color-health); }
        .cat-work { border-left: 4px solid var(--color-work); color: var(--color-work); }
        .cat-personal { border-left: 4px solid var(--color-personal); color: var(--color-personal); }

        .done .col-task, .done .col-time {
            text-decoration: line-through;
            color: var(--text-muted) !important;
            opacity: 0.5;
        }

        .loading {
            padding: 20px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Program Zilnic</h1>

    <div class="controls">
        <button id="btn-audio-auth">Sunet: Dezactivat</button>
        <button id="btn-push-auth">Notificări: Solicită</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check">
                <input type="checkbox" id="master-check" title="Check All">
            </div>
        </div>
        
        <!-- Zona în care JavaScript va injecta cele 14 rânduri din Google Sheets -->
        <div id="tasks-body">
            <div class="loading">Se încarcă datele live din Google Sheets...</div>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQDKIr1CRKpf_7bI9tyF2xfrhqaLYCeiD2hX7KJzxCWgMsg9NsItQqT4XEF9uTlY04687OKJBNowfs/pub?output=csv';
        
        let audioContext = null;
        const notifiedHours = new Set();
        const btnAudioAuth = document.getElementById('btn-audio-auth');
        const btnPushAuth = document.getElementById('btn-push-auth');
        const masterCheck = document.getElementById('master-check');
        const tasksBody = document.getElementById('tasks-body');

        // Normalizare timp: transformă "6:30" în "06:30" pentru compatibilitatea cu motorul de alerte
        function normalizeTime(timeStr) {
            if (!timeStr) return "";
            let clean = timeStr.trim();
            if (clean.includes(':') && clean.split(':')[0].length === 1) {
                clean = '0' + clean;
            }
            return clean;
        }

        // Funcție simplă de parsare CSV care respectă structura pe linii și coloane
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            // Sărim peste prima linie (header: Categorie, Interval, Task, Ora alerta)
            for (let i = 1; i < lines.length; i++) {
                if (!lines[i]) continue;
                
                // Împărțire de bază după virgulă
                const columns = lines[i].split(',');
                if (columns.length >= 4) {
                    result.push({
                        categorie: columns[0].trim().toLowerCase(),
                        interval: columns[1].trim(),
                        task: columns[2].trim(),
                        oraAlerta: normalizeTime(columns[3])
                    });
                }
            }
            return result;
        }

        // Încărcarea datelor și generarea DOM-ului (SSOT real bazat pe Sheets)
        async function loadSheetData() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                const tasks = parseCSV(csvText);
                
                tasksBody.innerHTML = ''; // Ștergem mesajul de loading
                
                tasks.forEach(task => {
                    const row = document.createElement('div');
                    row.className = `grid-row cat-${task.categorie}`;
                    row.setAttribute('data-start', task.oraAlerta);
                    
                    row.innerHTML = `
                        <div class="col-time">${task.interval}</div>
                        <div class="col-task">${task.task}</div>
                        <div class="col-check"><input type="checkbox" class="task-check"></div>
                    `;
                    
                    tasksBody.appendChild(row);
                });

                initCheckboxes();
                
            } catch (error) {
                tasksBody.innerHTML = `<div class="loading" style="color: #ef4444;">Eroare la conectarea cu Google Sheets. Verificați conexiunea.</div>`;
                console.error(error);
            }
        }

        // Inițializare evenimente checkbox după ce rândurile au fost create dinamic
        function initCheckboxes() {
            const taskChecks = document.querySelectorAll('.task-check');
            
            masterCheck.checked = false;
            masterCheck.indeterminate = false;

            masterCheck.onclick = () => {
                const isChecked = masterCheck.checked;
                taskChecks.forEach(check => {
                    check.checked = isChecked;
                    toggleRowStyle(check);
                });
            };

            taskChecks.forEach(check => {
                check.onclick = () => {
                    toggleRowStyle(check);
                    const allChecked = Array.from(taskChecks).every(c => c.checked);
                    const noneChecked = Array.from(taskChecks).every(c => !c.checked);
                    masterCheck.checked = allChecked;
                    masterCheck.indeterminate = !allChecked && !noneChecked;
                };
            });
        }

        function toggleRowStyle(checkbox) {
            const row = checkbox.closest('.grid-row');
            if (checkbox.checked) {
                row.classList.add('done');
            } else {
                row.classList.remove('done');
            }
        }

        // --- SUNET (Web Audio API) ---
        btnAudioAuth.addEventListener('click', () => {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            btnAudioAuth.textContent = "Sunet: Activ";
            btnAudioAuth.style.backgroundColor = "#15803d";
            playChime();
        });

        function playChime() {
            if (!audioContext) return;
            const now = audioContext.currentTime;
            const osc = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, now);
            osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.15);
            
            gainNode.gain.setValueAtTime(0.4, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
            
            osc.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            osc.start(now);
            osc.stop(now + 0.6);
        }

        // --- NOTIFICĂRI ---
        btnPushAuth.addEventListener('click', () => {
            if (!('Notification' in window)) {
