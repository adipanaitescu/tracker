<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic</title>
    <style>
        :root {
            --color-health: #F08209;
            --color-work: #8B5CF6;
            --color-personal: #3B82F6;
            --text-main: #333333;
            --text-muted: #888888;
            --border-light: #eef2f5;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7fafc;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 700;
        }

        /* --- BUTOANE DEZACTIVATE TEMPORAR (Comentate vizual) --- */
        .controls {
            display: none; 
        }

        .table-container {
            width: 100%;
            max-width: 550px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        /* Aliniere fixă pe 3 coloane prin CSS Grid */
        .grid-header, .grid-row {
            display: grid;
            grid-template-columns: 115px 1fr 65px;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }

        .grid-header {
            background-color: #f8fafc;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 16px 0;
            text-align: center;
            color: #475569;
        }

        .grid-row {
            padding: 16px 0;
            background-color: #ffffff;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .col-time {
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .col-task {
            padding: 0 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: center; /* Aliniere centrată pentru task, conform imaginii */
        }

        .col-check {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        /* Margini stânga pentru identificarea categoriei (Schema de culori activă) */
        .cat-health { border-left: 4px solid var(--color-health); }
        .cat-health .col-time, .cat-health .col-task { color: var(--color-health); }

        .cat-work { border-left: 4px solid var(--color-work); }
        .cat-work .col-time, .cat-work .col-task { color: var(--color-work); }

        .cat-personal { border-left: 4px solid var(--color-personal); }
        .cat-personal .col-time, .cat-personal .col-task { color: var(--color-personal); }

        /* Efect de Gray-out și tăiere text la bifare (Done) */
        .grid-row.done {
            background-color: #fafafa;
            opacity: 0.4;
        }
        .done .col-task, .done .col-time {
            text-decoration: line-through;
            color: var(--text-muted) !important;
        }

        /* Legendă Culori */
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bullet {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .loading {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Program Zilnic</h1>

    <!-- Butoane ascunse momentan (comentate prin logica CSS/JS) -->
    <div class="controls">
        <button id="btn-audio-auth">Sunet: Dezactivat</button>
        <button id="btn-push-auth">Notificări: Solicită</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check">
                <input type="checkbox" id="master-check" title="Check All">
            </div>
        </div>
        
        <!-- Injectare dinamică din Google Sheets -->
        <div id="tasks-body">
            <div class="loading">Se încarcă cele 14 task-uri din Google Sheets...</div>
        </div>
    </div>

    <!-- Legendă vizuală jos -->
    <div class="legend">
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-health)"></span> Sănătate & Sport</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-work)"></span> Muncă / Carieră</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-personal)"></span> Stil de viață / Personal</div>
    </div>

    <script>
        // Link-ul tău de publicare CSV
        const csvUrl = 'https://google.com';
        
        const masterCheck = document.getElementById('master-check');
        const tasksBody = document.getElementById('tasks-body');
        const notifiedHours = new Set();

        // Normalizare ore pentru alerte viitoare (ex: din "6:00" în "06:00")
        function normalizeTime(timeStr) {
            if (!timeStr) return "";
            let clean = timeStr.trim();
            if (clean.includes(':') && clean.split(':')[0].length === 1) {
                clean = '0' + clean;
            }
            return clean;
        }

        // PARSER AVANSAT REGEX (Rezolvă problema caracterelor speciale și a liniilor lipsă)
        function parseCSV(text) {
            const lines = text.split(/\r?\n/);
            const result = [];
            
            // Începem de la 1 pentru a omite linia de cap de tabel din Sheets
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;
                
                // Regex inteligent care împarte corect coloanele chiar dacă textul conține spații sau caractere speciale
                const matches = line.match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || line.split(',');
                
                // Curățăm ghilimelele reziduale generate de exportul Google Sheets
                const cleanCols = (matches || []).map(col => col.replace(/^"|"$/g, '').trim());

                if (cleanCols.length >= 4) {
                    result.push({
                        categorie: cleanCols[0].toLowerCase(),
                        interval: cleanCols[1],
                        task: cleanCols[2],
                        oraAlerta: normalizeTime(cleanCols[3])
                    });
                }
            }
            return result;
        }

        // Încărcarea datelor live (SSOT)
        async function loadSheetData() {
            try {
                const response = await fetch(csvUrl);
                const csvText = await response.text();
                const tasks = parseCSV(csvText);
                
                tasksBody.innerHTML = ''; 
                
                tasks.forEach(task => {
                    const row = document.createElement('div');
                    row.className = `grid-row cat-${task.categorie}`;
                    row.setAttribute('data-start', task.oraAlerta);
                    
                    row.innerHTML = `
                        <div class="col-time">${task.interval}</div>
                        <div class="col-task">${task.task}</div>
                        <div class="col-check"><input type="checkbox" class="task-check"></div>
                    `;
                    
                    tasksBody.appendChild(row);
                });

                initCheckboxesLogic();
                
            } catch (error) {
                tasksBody.innerHTML = `<div class="loading" style="color: #ef4444;">Eroare de sincronizare cu Google Sheets.</div>`;
                console.error(error);
            }
        }

        // LOGICA DE CHECKBOX: Check All și Stil de rând Done (Gray-out / Tăiat)
        function initCheckboxesLogic() {
            const taskChecks = document.querySelectorAll('.task-check');
            
            masterCheck.checked = false;
            masterCheck.indeterminate = false;

            // Logica buton master (Check All / Uncheck All)
            masterCheck.onclick = () => {
                const isChecked = masterCheck.checked;
                taskChecks.forEach(check => {
                    check.checked = isChecked;
                    toggleRowStyle(check);
                });
            };

            // Logica bife individuale
            taskChecks.forEach(check => {
                check.onclick = () => {
                    toggleRowStyle(check);
                    const allChecked = Array.from(taskChecks).every(c => c.checked);
                    const noneChecked = Array.from(taskChecks).every(c => !c.checked);
                    masterCheck.checked = allChecked;
                    masterCheck.indeterminate = !allChecked && !noneChecked;
                };
            });
        }

        function toggleRowStyle(checkbox) {
            const row = checkbox.closest('.grid-row');
