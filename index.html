<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic v01</title>
    <style>
        :root {
            --color-health: #F08209;
            --color-work: #8B5CF6;
            --color-personal: #3B82F6;
            --text-main: #333333;
            --text-muted: #888888;
            --border-light: #eef2f5;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7fafc;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 700;
        }

        .controls {
            display: none; 
        }

        .table-container {
            width: 100%;
            max-width: 550px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .grid-header, .grid-row {
            display: grid;
            grid-template-columns: 115px 1fr 65px;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }

        .grid-header {
            background-color: #f8fafc;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 16px 0;
            text-align: center;
            color: #475569;
        }

        .grid-row {
            padding: 16px 0;
            background-color: #ffffff;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .col-time {
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .col-task {
            padding: 0 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: center;
        }

        .col-check {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .cat-health { border-left: 4px solid var(--color-health); }
        .cat-health .col-time, .cat-health .col-task { color: var(--color-health); }

        .cat-work { border-left: 4px solid var(--color-work); }
        .cat-work .col-time, .cat-work .col-task { color: var(--color-work); }

        .cat-personal { border-left: 4px solid var(--color-personal); }
        .cat-personal .col-time, .cat-personal .col-task { color: var(--color-personal); }

        .grid-row.done {
            background-color: #fafafa;
            opacity: 0.4;
        }
        .done .col-task, .done .col-time {
            text-decoration: line-through;
            color: var(--text-muted) !important;
        }

        .legend {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bullet {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .loading {
            padding: 30px;
            text-align: center;
            color: var(--text-muted);
            font-style: italic;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <!-- Versiunea adăugată în titlu conform cerinței -->
    <h1>Program Zilnic v01</h1>

    <div class="controls">
        <button id="btn-audio-auth">Sunet: Dezactivat</button>
        <button id="btn-push-auth">Notificări: Solicită</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check">
                <input type="checkbox" id="master-check" title="Check All">
            </div>
        </div>
        
        <div id="tasks-body">
            <div class="loading">Se conectează la sursa de date...</div>
        </div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-health)"></span> Sănătate & Sport</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-work)"></span> Muncă / Carieră</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-personal)"></span> Stil de viață / Personal</div>
    </div>

        function normalizeTime(timeStr) {
            if (!timeStr) return "";
            let clean = timeStr.trim();
            if (clean.includes(':')) {
                const parts = clean.split(':');
                if (parts[0].length === 1) {
                    clean = '0' + clean;
                }
            }
            return clean;
        }

        // Parser curat fără apeluri invalide de tip .trim() pe array-uri
        function parseGoogleCSV(text) {
            const lines = [];
            let row = [""];
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                let c = text[i];
                let next = text[i+1];

                if (c === '"') {
                    if (inQuotes && next === '"') { row[row.length - 1] += '"'; i++; }
                    else { inQuotes = !inQuotes; }
                } else if (c === ',' && !inQuotes) {
                    row.push('');
                } else if ((c === '\r' || c === '\n') && !inQuotes) {
                    if (c === '\r' && next === '\n') { i++; }
                    lines.push(row);
                    row = [''];
                } else {
                    row[row.length - 1] += c;
                }
            }
            if (row.length > 1 || row[0] !== '') { lines.push(row); }

            const finalResult = [];
            for (let j = 1; j < lines.length; j++) {
                const cols = lines[j];
                if (cols.length >= 4) {
                    const cat = cols[0] ? cols[0].trim().toLowerCase() : "";
                    const interval = cols[1] ? cols[1].trim() : "";
                    const taskText = cols[2] ? cols[2].trim() : "";
                    const alertTime = cols[3] ? cols[3].trim() : "";

                    if (cat || interval || taskText) {
                        finalResult.push({
                            categorie: cat,
                            interval: interval,
                            task: taskText,
                            oraAlerta: normalizeTime(alertTime)
                        });
                    }
                }
            }
            return finalResult;
        }

        function renderRows(tasksArray) {
            tasksBody.innerHTML = ''; 
            tasksArray.forEach(task => {
                const row = document.createElement('div');
                row.className = `grid-row cat-${task.categorie}`;
                row.setAttribute('data-start', task.oraAlerta);
                
                row.innerHTML = `
                    <div class="col-time">${task.interval}</div>
                    <div class="col-task">${task.task}</div>
                    <div class="col-check"><input type="checkbox" class="task-check"></div>
                `;
                tasksBody.appendChild(row);
            });
            initCheckboxesLogic();
        }
