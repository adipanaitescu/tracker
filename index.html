<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic v07</title>
    <style>
        :root {
            --color-health: #F08209;
            --color-work: #8B5CF6;
            --color-personal: #3B82F6;
            --text-main: #333333;
            --text-muted: #888888;
            --border-light: #eef2f5;
        }

        body {
            margin: 0;
            padding: 20px 10px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7fafc;
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.6rem;
            color: #0f172a;
            margin: 0 0 20px 0;
            text-align: center;
            font-weight: 700;
        }

        .controls {
            display: none; 
        }

        .table-container {
            width: 100%;
            max-width: 550px;
            background-color: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .grid-header, .grid-row {
            display: grid;
            grid-template-columns: 115px 1fr 65px;
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }

        .grid-header {
            background-color: #f8fafc;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 16px 0;
            text-align: center;
            color: #475569;
        }

        .grid-row {
            padding: 16px 0;
            background-color: #ffffff;
            transition: background-color 0.2s, opacity 0.2s;
        }

        .col-time {
            text-align: center;
            font-weight: 600;
            font-size: 0.85rem;
        }

        .col-task {
            padding: 0 15px;
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: 500;
            text-align: center;
        }

        .col-check {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #3b82f6;
        }

        .cat-health { border-left: 4px solid var(--color-health); }
        .cat-health .col-time, .cat-health .col-task { color: var(--color-health); }

        .cat-work { border-left: 4px solid var(--color-work); }
        .cat-work .col-time, .cat-work .col-task { color: var(--color-work); }

        .cat-personal { border-left: 4px solid var(--color-personal); }
        .cat-personal .col-time, .cat-personal .col-task { color: var(--color-personal); }

        .grid-row.done {
            background-color: #fafafa;
            opacity: 0.4;
        }
        .done .col-task, .done .col-time {
            text-decoration: line-through;
            color: var(--text-muted) !important;
        }

        .legend {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .bullet {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }
    </style>
</head>
<body>

    <h1>Program Zilnic v07</h1>

    <div class="controls">
        <button id="btn-audio-auth">Sunet: Dezactivat</button>
        <button id="btn-push-auth">Notificări: Solicită</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check">
                <input type="checkbox" id="master-check" title="Check All">
            </div>
        </div>
        
        <div id="tasks-body"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-health)"></span> Sănătate & Sport</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-work)"></span> Muncă / Carieră</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-personal)"></span> Stil de viață / Personal</div>
    </div>

    <script>
        // Sursa reala din Google Sheets (exportata ca CSV)
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQDKIr1CRKpf_7bI9tyF2xfrhqaLYCeiD2hX7KJzxCWgMsg9NsItQqT4XEF9uTlY04687OKJBNowfs/pub?output=csv';
        
        const backupTasks = [
            { categorie: "health", interval: "06:00 - 06.30", task: "Trezirea", oraAlerta: "06:00" },
            { categorie: "health", interval: "06.30 - 07:30", task: "Mers pe jos 1h", oraAlerta: "06:30" },
            { categorie: "personal", interval: "07:30 - 08.00", task: "Pregatirea pentru munca (dush)", oraAlerta: "07:30" },
            { categorie: "work", interval: "08:00 - 16.00", task: "Munca", oraAlerta: "08:00" },
            { categorie: "personal", interval: "16.00 - 17.00", task: "Pregatirea mesei / Mancat", oraAlerta: "16:00" },
            { categorie: "health", interval: "17.00 - 17.15", task: "Exercitii glezne (seria 1)", oraAlerta: "17:00" },
            { categorie: "health", interval: "17.15 - 17.30", task: "Exercitii glezne (seria 2)", oraAlerta: "17:15" },
            { categorie: "health", interval: "17.30 - 17.45", task: "Exercitii glezne (seria 3)", oraAlerta: "17:30" },
            { categorie: "health", interval: "17.45 - 18.00", task: "Exercitii calisthenics", oraAlerta: "17:45" },
            { categorie: "health", interval: "18.00 - 18.15", task: "Exercitii musculatura (tractiuni)", oraAlerta: "18:00" },
            { categorie: "health", interval: "18.15 - 18.30", task: "Exercitii Kegel", oraAlerta: "18:15" },
            { categorie: "personal", interval: "18.30 - 20.00", task: "Vlad", oraAlerta: "18:30" },
            { categorie: "personal", interval: "20.00 - 21.00", task: "Pregatirea mesei / Mancat", oraAlerta: "20:00" },
            { categorie: "personal", interval: "21.00 - 22.00", task: "Chitara / citit / masaj / meditat", oraAlerta: "21:00" }
        ];

        const masterCheck = document.getElementById('master-check');
        const tasksBody = document.getElementById('tasks-body');

        // Încarcă statusul din LocalStorage sau creează un obiect nou
        let checkedTasksHistory = JSON.parse(localStorage.getItem('saved_tasks_status')) || {};

        function renderRows(tasksArray) {
            if (!tasksBody) return;
            
            let htmlBuffer = '';
            tasksArray.forEach(task => {
                const safeCat = (task.categorie || 'personal').toString().trim().toLowerCase();
                const safeInterval = (task.interval || '').toString().trim();
                const safeTask = (task.task || '').toString().trim();
                const safeAlert = (task.oraAlerta || '').toString().trim();
                
                // Generăm o cheie unică bazată pe oră și nume pentru a ști ce a fost bifat
                const taskKey = `${safeAlert}_${safeTask.replace(/\s+/g, '')}`;
                const isChecked = checkedTasksHistory[taskKey] ? 'checked' : '';
                const isDoneClass = checkedTasksHistory[taskKey] ? 'done' : '';

                htmlBuffer += `
                    <div class="grid-row cat-${safeCat} ${isDoneClass}" data-key="${taskKey}">
                        <div class="col-time">${safeInterval}</div>
                        <div class="col-task">${safeTask}</div>
                        <div class="col-check">
                            <input type="checkbox" class="task-check" ${isChecked}>
                        </div>
                    </div>
                `;
            });
            
            tasksBody.innerHTML = htmlBuffer;
            initCheckboxesLogic();
            updateMasterCheckboxState();
        }

        function cleanString(str) {
            if (!str) return '';
            return str.replace(/^"|"$/g, '').trim();
        }

                // Funcția de parsare CSV corectă, capabilă să ignore virgulele din interiorul ghilimelelor
        function parseCSVSecure(text) {
            const lines = text.split(/\r?\n/);
            const parsedTasks = [];

            // Presupunem ordinea coloanelor din foaie: Categorie, Interval, Task, OraAlerta
            for (let i = 1; i < lines.length; i++) {
                const line = lines[i].trim();
                if (!line) continue;

                let columns = [];
                let current = '';
                let inQuotes = false;

                for (let j = 0; j < line.length; j++) {
                    const char = line[j];
                    if (char === '"') {
                        inQuotes = !inQuotes;
                    } else if (char === ',' && !inQuotes) {
                        columns.push(cleanString(current));
                        current = '';
                    } else {
                        current += char;
                    }
                }
                columns.push(cleanString(current));

                // Mapăm coloanele pe structura aplicației
                if (columns.length >= 3) {
                    parsedTasks.push({
                        categorie: columns[0] || 'personal',
                        interval: columns[1] || '',
                        task: columns[2] || '',
                        oraAlerta: columns[3] || (columns[1] ? columns[1].split('-')[0].trim() : '')
                    });
                }
            }
            return parsedTasks.length > 0 ? parsedTasks : null;
        }
