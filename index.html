<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic v14</title>
    <style>
        :root {
            --color-health: #F08209; 
            --color-work: #8B5CF6; 
            --color-personal: #3B82F6;
            --text-main: #333333; 
            --text-muted: #888888; 
            --border-light: #eef2f5;
        }
        body {
            margin: 0; 
            padding: 20px 10px; 
            background-color: #f7fafc; 
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex; 
            flex-direction: column; 
            align-items: center;
        }
        h1 { 
            font-size: 1.6rem; 
            color: #0f172a; 
            margin: 0 0 15px 0; 
            font-weight: 700; 
            text-align: center; 
        }
        .archive-controls {
            display: flex; 
            align-items: center; 
            gap: 10px; 
            margin-bottom: 20px;
            background: #ffffff; 
            padding: 6px 12px; 
            border-radius: 30px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }
        .archive-controls button {
            background: none; 
            border: none; 
            font-size: 1.1rem; 
            cursor: pointer; 
            padding: 5px 10px; 
            color: #475569;
        }
        .archive-controls input[type="date"] {
            border: none; 
            font-weight: 700; 
            color: #1e293b; 
            font-family: inherit; 
            font-size: 0.95rem; 
            outline: none; 
            cursor: pointer;
        }
        .table-container {
            width: 100%; 
            max-width: 550px; 
            background-color: #ffffff; 
            border-radius: 12px;
            overflow: hidden; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        .grid-header, .grid-row {
            display: grid; 
            grid-template-columns: 115px 1fr 65px; 
            align-items: center;
            border-bottom: 1px solid var(--border-light);
        }
        .grid-header { 
            background-color: #f8fafc; 
            font-weight: 700; 
            font-size: 0.9rem; 
            padding: 16px 0; 
            text-align: center; 
            color: #475569; 
        }
        .grid-row { 
            padding: 16px 0; 
            background-color: #ffffff; 
            transition: background-color 0.2s, opacity 0.2s; 
        }
        .col-time { 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.85rem; 
        }
        .col-task { 
            padding: 0 15px; 
            font-size: 0.95rem; 
            line-height: 1.4; 
            font-weight: 500; 
            text-align: center; 
        }
        .col-check { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
        }
        input[type="checkbox"] { 
            width: 22px; 
            height: 22px; 
            cursor: pointer; 
            accent-color: #3b82f6; 
        }
        .cat-health { border-left: 4px solid var(--color-health); }
        .cat-health .col-time, .cat-health .col-task { color: var(--color-health); }
        .cat-work { border-left: 4px solid var(--color-work); }
        .cat-work .col-time, .cat-work .col-task { color: var(--color-work); }
        .cat-personal { border-left: 4px solid var(--color-personal); }
        .cat-personal .col-time, .cat-personal .col-task { color: var(--color-personal); }
        .grid-row.done { background-color: #fafafa; opacity: 0.4; }
        .done .col-task, .done .col-time { text-decoration: line-through; color: var(--text-muted) !important; }
        .legend { display: flex; gap: 15px; margin-top: 20px; font-size: 0.8rem; font-weight: 600; }
        .legend-item { display: flex; align-items: center; gap: 6px; }
        .bullet { width: 10px; height: 10px; border-radius: 50%; }
    </style>
</head>
<body>

    <h1>Program Zilnic v14</h1>

    <div class="archive-controls">
        <button id="btn-prev-day" title="Ziua anterioară">◀</button>
        <input type="date" id="date-picker">
        <button id="btn-next-day" title="Ziua următoare">▶</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check"><input type="checkbox" id="master-check" title="Check All"></div>
        </div>
        <div id="tasks-body"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-health)"></span> Sănătate & Sport</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-work)"></span> Muncă / Carieră</div>
        <div class="legend-item"><span class="bullet" style="background-color: var(--color-personal)"></span> Stil de viață / Personal</div>
    </div>
