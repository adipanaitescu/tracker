<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Program Zilnic v23</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>Program Zilnic v23</h1>

    <div class="archive-controls">
        <button id="btn-prev-day" title="Ziua anterioară">◀</button>
        <span id="date-display" class="date-display"></span>
        <button id="btn-today" title="Astazi">AZI</button>
        <input type="date" id="date-picker" lang="ro-RO">
        <button id="btn-next-day" title="Ziua următoare">▶</button>
    </div>

    <div class="table-container">
        <div class="grid-header">
            <div>Ora</div>
            <div>Task</div>
            <div class="col-check"><input type="checkbox" id="master-check" title="Check All"></div>
        </div>
        <div id="tasks-body"></div>
    </div>

    <div class="legend">
        <div class="legend-item"><span class="bullet health"></span> Sport</div>
        <div class="legend-item"><span class="bullet work"></span> Muncă</div>
        <div class="legend-item"><span class="bullet personal"></span> Personal</div>
    </div>

    <div id="status-bar" class="status-bar">
        <div class="status-top">
            <span id="data-source"></span>
            <div id="last-updated"></div>
        </div>
        <div class="status-bottom">
            <div id="alert-banner" class="google-btn is-warning" role="button" tabindex="0" aria-label="Activează alertele">
                <span class="btn-icon">🔔</span>
                <span class="alert-label">Activează alertele</span>
            </div>
            <button id="btn-refresh" class="btn-refresh" title="Reîncarcă datele">⟳ Reîncarcă</button>
        </div>
    </div>

    <script>
        const csvUrl = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQQDKIr1CRKpf_7bI9tyF2xfrhqaLYCeiD2hX7KJzxCWgMsg9NsItQqT4XEF9uTlY04687OKJBNowfs/pub?output=csv';
        
        let globalTasksBuffer = []; 
        let currentDateString = "";
        let dataSource = "backupTasks";
        let lastUpdatedTime = "";

        const datePicker = document.getElementById('date-picker');
        const masterCheck = document.getElementById('master-check');
        const tasksBody = document.getElementById('tasks-body');

        const backupTasks = [
            { categorie: "health", interval: "06:00 - 06.30", task: "Trezirea", oraAlerta: "06:00" },
            { categorie: "health", interval: "06.30 - 07:30", task: "Mers pe jos 1h", oraAlerta: "06:30" },
            { categorie: "personal", interval: "07:30 - 08.00", task: "Pregatirea pentru munca (dush)", oraAlerta: "07:30" },
            { categorie: "work", interval: "08:00 - 16.00", task: "Munca", oraAlerta: "08:00" },
            { categorie: "personal", interval: "16.00 - 17.00", task: "Pregatirea mesei / Mancat", oraAlerta: "16:00" },
            { categorie: "health", interval: "17.00 - 17.15", task: "Exercitii glezne (seria 1)", oraAlerta: "17:00" },
            { categorie: "health", interval: "17.15 - 17.30", task: "Exercitii glezne (seria 2)", oraAlerta: "17:15" },
            { categorie: "health", interval: "17.30 - 17.45", task: "Exercitii glezne (seria 3)", oraAlerta: "17:30" },
            { categorie: "health", interval: "17.45 - 18.00", task: "Exercitii calisthenics", oraAlerta: "17:45" },
            { categorie: "health", interval: "18.00 - 18.15", task: "Exercitii musculatura (tractiuni)", oraAlerta: "18:00" },
            { categorie: "health", interval: "18.15 - 18.30", task: "Exercitii Kegel", oraAlerta: "18:15" },
            { categorie: "personal", interval: "18.30 - 20.00", task: "Vlad", oraAlerta: "18:30" },
            { categorie: "personal", interval: "20.00 - 21.00", task: "Pregatirea mesei / Mancat", oraAlerta: "20:00" },
            { categorie: "personal", interval: "21.00 - 22.00", task: "Chitara / citit / masaj / meditat", oraAlerta: "21:00" }
        ];

        function areValidGoogleSheetUrl(url) {
            return typeof url === 'string' && url.trim() !== '' && /^https?:\/\//i.test(url.trim());
        }

        function updateStatusDisplay() {
            const dataSourceEl = document.getElementById('data-source');
            const lastUpdatedEl = document.getElementById('last-updated');
            
            if (dataSourceEl) {
                dataSourceEl.textContent = dataSource === 'google' ? `Date live din Google Sheets - ${globalTasksBuffer.length} task-uri` : 'Date din backupTasks';
            }
            if (lastUpdatedEl) {
                if (lastUpdatedTime) {
                    lastUpdatedEl.innerHTML = `<div class="google-timestamp"><div class="status-dot"></div><span class="timestamp-text">actualizat la ${lastUpdatedTime}</span></div>`;
                } else {
                    lastUpdatedEl.innerHTML = '';
                }
            }
        }

        async function fetchLiveGoogleData() {
            if (!areValidGoogleSheetUrl(csvUrl)) {
                dataSource = 'backupTasks';
                globalTasksBuffer = backupTasks;
                renderRows(globalTasksBuffer);
                updateStatusDisplay();
                return;
            }

            const requestUrl = csvUrl.includes('?') ? `${csvUrl}&cb=${Date.now()}` : `${csvUrl}?cb=${Date.now()}`;

            try {
                const response = await fetch(requestUrl, { cache: 'no-store' });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                const dataText = await response.text();
                const parsedTasks = parseCSV(dataText);
                globalTasksBuffer = Array.isArray(parsedTasks) && parsedTasks.length ? parsedTasks : backupTasks;
                dataSource = globalTasksBuffer.length > 0 && globalTasksBuffer !== backupTasks ? 'google' : 'backupTasks';
                
                const now = new Date();
                lastUpdatedTime = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}:${String(now.getSeconds()).padStart(2, '0')}`;
                
                renderRows(globalTasksBuffer);
                updateStatusDisplay();
            } catch (error) {
                console.warn('Datele live nu au putut fi încărcate, folosim backupTasks.', error);
                dataSource = 'backupTasks';
                globalTasksBuffer = backupTasks;
                renderRows(globalTasksBuffer);
                updateStatusDisplay();
            }
        }

        function parseCSV(text) {
            if (typeof text !== 'string' || !text.trim()) {
                return backupTasks;
            }

            const textCurat = text.replace(/\uFEFF/g, '').replace(/"/g, '').replace(/\r/g, '');
            const linii = textCurat.split('\n').map(line => line.trim()).filter(Boolean);
            const arrayRezultat = [];

            for (let i = 1; i < linii.length; i++) {
                const celule = linii[i].split(',').map(cell => cell.trim());
                if (celule.length < 3) continue;

                const [categorie, interval, task, ...rest] = celule;
                if (!categorie || !interval || !task) continue;

                arrayRezultat.push({
                    categorie: categorie.toLowerCase(),
                    interval,
                    task,
                    oraAlerta: rest.length ? rest[0] : ""
                });
            }

            return arrayRezultat.length > 0 ? arrayRezultat : backupTasks;
        }

        function renderRows(tasks) {
            if (!tasksBody) return;
            tasksBody.innerHTML = '';
            const statusSalvat = iaIstoricZiCurenta();

            tasks.forEach((item, index) => {
                const esteBifat = Boolean(statusSalvat[index]);
                const row = document.createElement('div');
                row.className = `grid-row cat-${item.categorie} ${esteBifat ? 'done' : ''}`;
                row.innerHTML = `
                    <div class="col-time">${item.interval}</div>
                    <div class="col-task">${item.task}</div>
                    <div class="col-check"><input type="checkbox" data-index="${index}" ${esteBifat ? 'checked' : ''}></div>
                `;
                tasksBody.appendChild(row);
            });

            document.querySelectorAll('#tasks-body input[type="checkbox"]').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const idx = this.getAttribute('data-index');
                    const statusCurent = iaIstoricZiCurenta();
                    statusCurent[idx] = this.checked;
                    salveazaIstoricZiCurenta(statusCurent);
                    this.closest('.grid-row').classList.toggle('done', this.checked);
                    actualizeazaMasterCheck();
                });
            });
            actualizeazaMasterCheck();
        }

        function actualizeazaMasterCheck() {
            if (!masterCheck) return;
            const toateCheckboxurile = document.querySelectorAll('#tasks-body input[type="checkbox"]');
            if (toateCheckboxurile.length === 0) { masterCheck.checked = false; return; }
            const toateSuntBifate = Array.from(toateCheckboxurile).every(cb => cb.checked);
            masterCheck.checked = toateSuntBifate;
        }

        if (masterCheck) {
            masterCheck.addEventListener('change', function() {
                const statusCurent = iaIstoricZiCurenta();
                document.querySelectorAll('#tasks-body input[type="checkbox"]').forEach(cb => {
                    cb.checked = this.checked;
                    const idx = cb.getAttribute('data-index');
                    statusCurent[idx] = this.checked;
                    cb.closest('.grid-row').classList.toggle('done', this.checked);
                });
                salveazaIstoricZiCurenta(statusCurent);
            });
        }

        function formateazaDataLocal(obiectData) {
            const an = obiectData.getFullYear();
            const luna = String(obiectData.getMonth() + 1).padStart(2, '0');
            const zi = String(obiectData.getDate()).padStart(2, '0');
            return `${an}-${luna}-${zi}`;
        }

        function updateDateDisplay() {
            const dateDisplay = document.getElementById('date-display');
            if (dateDisplay && currentDateString) {
                const [year, month, day] = currentDateString.split('-');
                dateDisplay.textContent = `${day}/${month}/${year}`;
            }
        }

        function setupAlertToggle() {
            const alertBanner = document.getElementById('alert-banner');
            if (!alertBanner) return;

            const label = alertBanner.querySelector('.alert-label');

            const applyAlertState = (isActive) => {
                alertBanner.classList.toggle('is-warning', !isActive);
                alertBanner.classList.toggle('is-active', isActive);
                alertBanner.setAttribute('aria-label', isActive ? 'Alerte active' : 'Activează alertele');
                if (label) {
                    label.textContent = isActive ? 'Alerte active' : 'Activează alertele';
                }
            };

            alertBanner.addEventListener('click', () => {
                const isActive = alertBanner.classList.contains('is-active');
                applyAlertState(!isActive);
            });

            alertBanner.addEventListener('keydown', (event) => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    alertBanner.click();
                }
            });
        }

        function initCalendar() {
            currentDateString = formateazaDataLocal(new Date());
            updateDateDisplay();
            if (datePicker) {
                datePicker.value = currentDateString;
                datePicker.addEventListener('change', function() {
                    currentDateString = this.value;
                    updateDateDisplay();
                    renderRows(globalTasksBuffer);
                });
            }
            document.getElementById('btn-prev-day')?.addEventListener('click', () => {
                schimbaZiua(-1);
                updateDateDisplay();
            });
            document.getElementById('btn-next-day')?.addEventListener('click', () => {
                schimbaZiua(1);
                updateDateDisplay();
            });
            document.getElementById('btn-today')?.addEventListener('click', () => {
                currentDateString = formateazaDataLocal(new Date());
                if (datePicker) datePicker.value = currentDateString;
                updateDateDisplay();
                renderRows(globalTasksBuffer);
            });
            document.getElementById('btn-refresh')?.addEventListener('click', () => {
                fetchLiveGoogleData();
            });
            setupAlertToggle();
        }

        function schimbaZiua(directie) {
            if (!currentDateString) {
                currentDateString = formateazaDataLocal(new Date());
            }
            let dObj = new Date(currentDateString);
            dObj.setDate(dObj.getDate() + directie);
            currentDateString = formateazaDataLocal(dObj);
            if (datePicker) datePicker.value = currentDateString;
            renderRows(globalTasksBuffer);
        }

        function iaIstoricZiCurenta() {
            const cheieInLocalStorage = "saved_tasks_status_" + currentDateString;
            try {
                const valoare = localStorage.getItem(cheieInLocalStorage);
                return valoare ? JSON.parse(valoare) : {};
            } catch (error) {
                console.warn('Local storage indisponibil pentru istoricul zilei.', error);
                return {};
            }
        }

        function salveazaIstoricZiCurenta(istoric) {
            const cheieInLocalStorage = "saved_tasks_status_" + currentDateString;
            try {
                localStorage.setItem(cheieInLocalStorage, JSON.stringify(istoric));
            } catch (error) {
                console.warn('Nu s-a putut salva istoricul în browser.', error);
            }
        }

        initCalendar();
        fetchLiveGoogleData();
    </script>
</body>
</html>
